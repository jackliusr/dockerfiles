# Plain-HTTP front door for the two IBM MQ web consoles.
#
# The consoles only speak HTTPS with a self-signed certificate that mqweb
# regenerates on every start, so browsers (and non-interactive clients) often
# refuse them. These listeners terminate the browser leg as HTTP and make the
# container-to-container hop over HTTPS without verifying that throwaway cert.
#
# Demo only: there is no TLS in front of the console, and only the demo admin
# password protects it.

# Docker's embedded DNS. Upstreams are resolved per request through variables,
# so recreating a queue manager container (new IP address) needs no reload.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    location / {
        set $upstream https://qm1:9443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name qm1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 8081;
    location / {
        set $upstream https://qm2:9443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name qm2;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}
